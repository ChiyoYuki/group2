services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: dream_journey
      POSTGRES_USER: dream_journey
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dream_journey_dev}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dream_journey -d dream_journey"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
